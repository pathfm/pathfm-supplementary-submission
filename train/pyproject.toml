[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "pathfm-train"
version = "0.1.0"
description = "PathFM training code with a chaotic-system forecasting example."
requires-python = ">=3.11,<3.13"
dependencies = ["pathfm==0.1.0", "pyarrow>=16,<26"]  # Keep NumPy 1.26 compatibility.

[tool.setuptools.packages.find]
include = ["pathfm_train*"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
